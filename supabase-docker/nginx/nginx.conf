events {}

http {
  server {
    listen 8000;

    location /rest/v1/ {
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass http://rest:3000;
      proxy_set_header Host $host;
    }

    location /storage/v1/ {
      rewrite ^/storage/v1/(.*)$ /$1 break;
      proxy_pass http://storage:5000;
      proxy_set_header Host $host;
      client_max_body_size 100M;
    }
  }
}
